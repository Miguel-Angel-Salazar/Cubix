<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCFOP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGradCFOP)" rx="12" />
  <text x="200" y="32" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MÉTODO CFOP (FRIDRICH)</text>
  <text x="200" y="52" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">El estándar de velocidad: Cross · F2L · OLL · PLL</text>

  <!-- 4 Bloques -->
  <!-- 1. Cross -->
  <g transform="translate(20, 75)">
    <rect width="80" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" />
    <text x="40" y="26" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">C</text>
    <text x="40" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CROSS</text>
    <!-- mini cube -->
    <rect x="15" y="56" width="50" height="50" fill="#334155" rx="4" />
    <line x1="15" y1="73" x2="65" y2="73" stroke="#0f172a" stroke-width="1" />
    <line x1="15" y1="89" x2="65" y2="89" stroke="#0f172a" stroke-width="1" />
    <line x1="32" y1="56" x2="32" y2="106" stroke="#0f172a" stroke-width="1" />
    <line x1="48" y1="56" x2="48" y2="106" stroke="#0f172a" stroke-width="1" />
    <rect x="32" y="56" width="16" height="50" fill="#ffffff" opacity="0.85" />
    <rect x="15" y="73" width="50" height="16" fill="#ffffff" opacity="0.85" />
    <text x="40" y="128" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Cruz Blanca</text>
    <text x="40" y="140" fill="#38bdf8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">~6-8 giros</text>
  </g>

  <!-- 2. F2L -->
  <g transform="translate(112, 75)">
    <rect width="80" height="150" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8" />
    <text x="40" y="26" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">F</text>
    <text x="40" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">F2L</text>
    <rect x="15" y="56" width="50" height="50" fill="#334155" rx="4" />
    <rect x="15" y="73" width="50" height="33" fill="#10b981" opacity="0.75" rx="2" />
    <text x="40" y="128" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">4 Pares</text>
    <text x="40" y="140" fill="#10b981" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">41 Casos</text>
  </g>

  <!-- 3. OLL -->
  <g transform="translate(204, 75)">
    <rect width="80" height="150" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8" />
    <text x="40" y="26" fill="#f59e0b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">O</text>
    <text x="40" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OLL</text>
    <rect x="15" y="56" width="50" height="50" fill="#334155" rx="4" />
    <rect x="15" y="56" width="50" height="17" fill="#f59e0b" opacity="0.9" rx="2" />
    <text x="40" y="128" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Orientar Cara</text>
    <text x="40" y="140" fill="#f59e0b" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">57 Algoritmos</text>
  </g>

  <!-- 4. PLL -->
  <g transform="translate(296, 75)">
    <rect width="80" height="150" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8" />
    <text x="40" y="26" fill="#ef4444" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">P</text>
    <text x="40" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PLL</text>
    <rect x="15" y="56" width="50" height="50" fill="#ef4444" opacity="0.8" rx="4" />
    <text x="40" y="85" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">T-Perm</text>
    <text x="40" y="128" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Permutar</text>
    <text x="40" y="140" fill="#ef4444" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">21 Algoritmos</text>
  </g>

  <text x="200" y="255" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tiempo promedio de speedcubers pro: 6 a 9 segundos</text>
</svg>
