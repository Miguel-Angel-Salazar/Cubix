<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradZZ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGradZZ)" rx="12" />
  <text x="200" y="34" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MÉTODO ZZ (EOLINE Y 0 ROTACIONES)</text>
  <text x="200" y="54" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Orientación inicial de aristas · Giros fluidos con caras R, U, L</text>

  <!-- Diagrama EOLine -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="120" fill="#1e293b" stroke="#334155" stroke-width="2" rx="8" />
    <line x1="60" y1="10" x2="60" y2="110" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <circle cx="60" cy="20" r="8" fill="#38bdf8" />
    <circle cx="60" cy="100" r="8" fill="#38bdf8" />
    <text x="60" y="65" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">EO-Line</text>
    <text x="60" y="145" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Aristas Orientadas</text>
  </g>

  <!-- Fases y Giros -->
  <g transform="translate(215, 80)">
    <rect x="0" y="0" width="145" height="135" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8" />
    <text x="72" y="24" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FLUJO DE ZZ</text>
    <text x="14" y="52" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">1. EOLine (Orientar)</text>
    <text x="14" y="78" fill="#10b981" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2. ZZ-F2L (Bloques)</text>
    <text x="14" y="104" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">3. LL (Última capa)</text>
    <text x="72" y="125" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">¡Sin rotar el cubo!</text>
  </g>

  <text x="200" y="255" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ideal para resolución con una mano (One-Handed - OH)</text>
</svg>
