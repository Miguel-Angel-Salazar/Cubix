<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGradP)" rx="12" />
  <!-- Título del diagrama -->
  <text x="200" y="36" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MÉTODO PRINCIPIANTE: CRUZ Y CAPAS</text>
  <text x="200" y="56" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Paso 1: Cruz Blanca · Paso 2: Esquinas (R U R' U')</text>

  <!-- Cara superior (Cruz Blanca) -->
  <g transform="translate(60, 80)">
    <!-- Marco de la cara -->
    <rect x="0" y="0" width="120" height="120" fill="#334155" rx="8" />
    <!-- 9 stickers -->
    <!-- Fila 1 -->
    <rect x="5" y="5" width="34" height="34" fill="#64748b" rx="4" />
    <rect x="43" y="5" width="34" height="34" fill="#ffffff" rx="4" />
    <rect x="81" y="5" width="34" height="34" fill="#64748b" rx="4" />
    <!-- Fila 2 -->
    <rect x="5" y="43" width="34" height="34" fill="#ffffff" rx="4" />
    <rect x="43" y="43" width="34" height="34" fill="#ffffff" rx="4" />
    <rect x="81" y="43" width="34" height="34" fill="#ffffff" rx="4" />
    <!-- Fila 3 -->
    <rect x="5" y="81" width="34" height="34" fill="#64748b" rx="4" />
    <rect x="43" y="81" width="34" height="34" fill="#ffffff" rx="4" />
    <rect x="81" y="81" width="34" height="34" fill="#64748b" rx="4" />

    <text x="60" y="145" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Cruz Blanca</text>
  </g>

  <!-- Notación Sexy Move -->
  <g transform="translate(210, 85)">
    <rect x="0" y="0" width="150" height="130" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8" />
    <text x="75" y="28" fill="#f59e0b" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ALGORITMO CLAVE</text>
    <text x="75" y="60" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">R  U  R'  U'</text>
    <line x1="20" y1="75" x2="130" y2="75" stroke="#334155" stroke-width="1" />
    <text x="75" y="95" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">R: Subir derecha</text>
    <text x="75" y="112" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">U: Girar arriba izquierda</text>
  </g>

  <!-- Pie con fases -->
  <text x="200" y="255" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cruz → 1ª Capa → 2ª Capa → Cruz Amarilla → Orientar → Permutar</text>
</svg>
