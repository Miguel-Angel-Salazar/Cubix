            <div class="marca">
                <a href="index.html" class="logo-cubix">
                    <span class="logo-icono" aria-hidden="true">🧊</span>
                    <h1 class="logo-texto">CUBIX</h1>
                </a>
                <p class="lema-sitio">El mundo del cubo de Rubik</p>
            </div>

            <button id="boton-menu" class="boton-menu" aria-label="Abrir menú de navegación" aria-expanded="false">
                <span class="linea"></span>

                <span class="linea"></span>

            <nav id="navegacion-principal" class="nav-principal">
                <ul class="menu-lista">
                    <li><a href="index.html" class="enlace-nav">Inicio</a></li>
                    <li><a href="cubos.html" class="enlace-nav">Cubos</a></li>
                    <li><a href="blog.html" class="enlace-nav">Blog</a></li>

        <section class="pagina-cabecera">
            <h2 class="titulo-seccion">Tienda CUBIX</h2>
            <p class="descripcion-seccion">

            <div class="filtro">
                <label for="categoria">Filtrar por categoría:</label>
                <select id="categoria">
                    <option value="todos">Todos</option>
                    <option value="cubos">Cubos</option>
                    <option value="puzzles">Puzzles</option>
                    <option value="accesorios">Accesorios</option>
                </select>
            </div>

            <div id="catalogo-productos" class="catalogo">
