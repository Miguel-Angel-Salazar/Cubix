        <nav>

            </ul>
        </nav>

    <main>

        <section class="pagina">
            <h2>Contacto</h2>

            <p>
                ¿Tienes alguna pregunta o sugerencia?
                Escríbenos y estaremos atentos.
            </p>

            <form id="formulario-contacto" class="formulario">

                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre"
                >

                <span id="error-nombre" class="error"></span>


                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                >

                <span id="error-correo" class="error"></span>


                <label for="mensaje">Mensaje</label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Escribe tu mensaje"
                ></textarea>

                <span id="error-mensaje" class="error"></span>


                <button type="submit">
                    Enviar mensaje
                </button>

                <p id="mensaje-exito" class="mensaje-exito"></p>

            </form>

        </section>

    </main>
